<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GLMW Scout Calendar 2026–27</title>
<link rel="icon" href="/glmw-logo.png">
<style>
:root {
  --purple:#7B3F8C; --purple-dark:#5a2d6b; --purple-light:#f3eaf7;
  --bg:#f1f3f4; --surface:#fff; --border:#dadce0; --text:#202124; --muted:#70757a;
  --nat-bg:#fff8e1; --nat-b:#f59f00; --nat-t:#7d4e00;
  --cty-bg:#f3eaf7; --cty-b:#7B3F8C; --cty-t:#4a1d6b;
  --trn-bg:#e0f4ff; --trn-b:#0284c7; --trn-t:#0c4a6e;
  --rgn-bg:#ccfbf1; --rgn-b:#0d9488; --rgn-t:#134e4a;
  --int-bg:#ede9fe; --int-b:#6d28d9; --int-t:#3b0764;
  --dst-bg:#fef3c7; --dst-b:#d97706; --dst-t:#78350f;
  --shadow:0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08);
  --shadow-lg:0 4px 20px rgba(0,0,0,.15);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Google Sans',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column;overflow:hidden}

.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:64px;display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:var(--shadow);z-index:50}
.logo{height:44px;width:auto;flex-shrink:0}
.hdiv{width:1px;height:30px;background:var(--border);flex-shrink:0}
.htitle{font-size:1.15rem;font-weight:400;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle small{font-size:.7rem;color:var(--muted);display:block;margin-top:1px}
.hright{display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap}

.btn{border:none;cursor:pointer;border-radius:20px;font-size:.8rem;font-weight:500;padding:7px 15px;transition:all .15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;text-decoration:none}
.btn-p{background:var(--purple);color:#fff}
.btn-p:hover{background:var(--purple-dark)}
.btn-g{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-g:hover{background:var(--bg)}
.btn-d{background:#fce8e6;color:#c5221f;border:none}
.btn-d:hover{background:#f5c6c4}
.btn-sm{padding:5px 12px;font-size:.75rem;border-radius:14px}
.btn-ico{width:32px;height:32px;padding:0;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:.95rem;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;transition:all .15s}
.btn-ico:hover{background:var(--bg);border-color:var(--purple);color:var(--purple)}

.vtabs{display:flex;background:var(--bg);border-radius:20px;padding:3px;gap:2px}
.vtab{border:none;background:transparent;border-radius:16px;padding:5px 13px;font-size:.76rem;font-weight:500;cursor:pointer;color:var(--muted);transition:all .15s}
.vtab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

.auth-pill{display:flex;align-items:center;gap:6px;background:var(--purple-light);color:var(--purple);border:1px solid var(--purple);border-radius:20px;padding:5px 12px;font-size:.75rem;font-weight:500}
.auth-av{width:22px;height:22px;border-radius:50%;object-fit:cover}
.login-btn{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:7px 13px;font-size:.78rem;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s}
.login-btn:hover{border-color:var(--purple);color:var(--purple)}

.app-body{display:flex;flex:1;overflow:hidden}
.sidebar{width:252px;min-width:180px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:14px;flex-shrink:0}
.main{flex:1;overflow-y:auto;padding:16px 20px}
.watermark{position:fixed;bottom:24px;right:24px;opacity:.055;pointer-events:none;z-index:0;width:220px}

.sh{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:7px}
.leg{display:flex;align-items:center;gap:7px;font-size:.78rem;margin-bottom:2px;cursor:pointer;user-select:none;padding:3px 5px;border-radius:8px}
.leg:hover{background:var(--bg)}
.ldot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

.dpill{display:flex;align-items:center;justify-content:space-between;padding:4px 9px;border-radius:14px;font-size:.73rem;font-weight:500;margin-bottom:3px;border:1px solid}
.dpill-del{background:none;border:none;cursor:pointer;color:var(--muted);font-size:11px;padding:0 2px;display:none}
body.editor .dpill-del{display:inline}
.dadd{display:none;gap:4px;margin-top:5px}
body.editor .dadd{display:flex}
.dadd input{flex:1;border:1px solid var(--border);border-radius:16px;padding:5px 9px;font-size:.73rem;outline:none}
.dadd input:focus{border-color:var(--purple)}
.dadd button{background:var(--purple);color:#fff;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.dfilter{display:flex;flex-direction:column;gap:3px}
.dfpill{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 10px;font-size:.74rem;font-weight:500;cursor:pointer;color:var(--muted);transition:all .15s}
.dfpill:hover{background:var(--bg);color:var(--text)}
.dfpill.active{color:var(--text);font-weight:700}
.dfpill-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

.chead{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chead h2{font-size:1.2rem;font-weight:400;flex:1}
.mjump{border:1px solid var(--border);border-radius:16px;padding:5px 10px;font-size:.78rem;background:var(--surface);color:var(--text);cursor:pointer;outline:none}
.mjump:focus{border-color:var(--purple)}
.today-btn{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:16px;padding:5px 12px;font-size:.78rem;font-weight:500;cursor:pointer}
.today-btn:hover{background:var(--bg)}

.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.cdh{text-align:center;font-size:.68rem;font-weight:600;color:var(--muted);padding:8px 0;background:var(--surface);text-transform:uppercase;letter-spacing:.04em}
.ccell{min-height:110px;background:var(--surface);padding:4px;transition:background .1s}
.ccell:hover{background:#fafbff}
.ccell.other{background:#f8f9fa}
.ccell.other .dnum{color:#bdc1c6}
.ccell.today .dnum{background:var(--purple);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.drow{display:flex;align-items:center;justify-content:space-between;min-height:26px;margin-bottom:2px}
.dnum{font-size:.78rem;font-weight:500;width:24px;text-align:center}
.addbt{opacity:0;background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;transition:all .1s}
.ccell:hover .addbt{opacity:1}
.addbt:hover{background:var(--purple-light);color:var(--purple)}

.chip{display:block;margin-bottom:2px;border-radius:4px;padding:2px 6px;font-size:.66rem;font-weight:500;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;transition:filter .1s;border-left:3px solid transparent}
.chip:hover{filter:brightness(.9)}
.chip.national{background:var(--nat-bg);color:var(--nat-t);border-color:var(--nat-b)}
.chip.county{background:var(--cty-bg);color:var(--cty-t);border-color:var(--cty-b)}
.chip.training{background:var(--trn-bg);color:var(--trn-t);border-color:var(--trn-b)}
.chip.region{background:var(--rgn-bg);color:var(--rgn-t);border-color:var(--rgn-b)}
.chip.international{background:var(--int-bg);color:var(--int-t);border-color:var(--int-b)}
.chip.district{background:var(--dst-bg);color:var(--dst-t);border-color:var(--dst-b)}
.more{font-size:.63rem;color:var(--muted);padding:1px 4px;cursor:pointer}
.more:hover{text-decoration:underline}

.lmonth{margin-bottom:22px}
.lmh{font-size:.9rem;font-weight:600;padding:5px 0;border-bottom:1px solid var(--border);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.lcnt{background:var(--purple);color:#fff;border-radius:10px;padding:1px 9px;font-size:.68rem}
.lev{display:flex;align-items:flex-start;gap:10px;background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:4px;cursor:pointer;border:1px solid transparent;transition:all .1s}
.lev:hover{box-shadow:var(--shadow);border-color:var(--border)}
.lbar{width:4px;border-radius:2px;flex-shrink:0;align-self:stretch;min-height:32px}
.lbar.national{background:var(--nat-b)}.lbar.county{background:var(--cty-b)}.lbar.training{background:var(--trn-b)}
.lbar.region{background:var(--rgn-b)}.lbar.international{background:var(--int-b)}.lbar.district{background:var(--dst-b)}
.ldate{min-width:42px;text-align:center}
.lday{font-size:1.3rem;font-weight:300;line-height:1}
.ldow{font-size:.65rem;color:var(--muted)}
.linfo{flex:1}
.ltitle{font-size:.88rem;font-weight:500}
.lmeta{font-size:.73rem;color:var(--muted);margin-top:2px}
.lbadge{font-size:.6rem;font-weight:600;border-radius:10px;padding:2px 7px;white-space:nowrap;flex-shrink:0;align-self:flex-start;margin-top:2px}
.lbadge.national{background:var(--nat-bg);color:var(--nat-t)}.lbadge.county{background:var(--cty-bg);color:var(--cty-t)}
.lbadge.training{background:var(--trn-bg);color:var(--trn-t)}.lbadge.region{background:var(--rgn-bg);color:var(--rgn-t)}
.lbadge.international{background:var(--int-bg);color:var(--int-t)}.lbadge.district{background:var(--dst-bg);color:var(--dst-t)}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
.panel h3{font-size:.88rem;font-weight:600;margin-bottom:12px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px}
.scard{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:var(--surface);font-size:.78rem;font-weight:500;transition:all .15s;color:var(--text);text-decoration:none}
.scard:hover{border-color:var(--purple);background:var(--purple-light);box-shadow:var(--shadow)}
.scard img{width:32px;height:32px;object-fit:contain;border-radius:6px;flex-shrink:0}
.scard-ico{font-size:1.5rem;flex-shrink:0}
.surl{font-family:monospace;font-size:.72rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;word-break:break-all;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:8px}
.surl button{background:var(--purple);color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:.7rem;cursor:pointer;flex-shrink:0}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:var(--surface);border-radius:16px;padding:24px;width:100%;max-width:460px;box-shadow:var(--shadow-lg);position:relative;max-height:92vh;overflow-y:auto}
.modal h2{font-size:1.05rem;font-weight:500;margin-bottom:18px}
.mclose{position:absolute;top:12px;right:12px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.mclose:hover{background:var(--bg)}
.fg{margin-bottom:13px}
.fg label{display:block;font-size:.7rem;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.fg input,.fg select,.fg textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:.88rem;background:var(--surface);color:var(--text);font-family:inherit;outline:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--purple);box-shadow:0 0 0 2px rgba(123,63,140,.1)}
.fg textarea{min-height:56px;resize:vertical}
.mact{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#323232;color:#fff;padding:10px 20px;border-radius:8px;font-size:.82rem;z-index:999;transition:transform .28s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.loading{display:flex;align-items:center;justify-content:center;height:200px;color:var(--muted);gap:10px}
.spinner{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:740px){
  .app-body,.main,html,body{overflow:visible;height:auto}
  body{overflow:auto}
  .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border)}
  .ccell{min-height:68px}
}
</style>
</head>
<body>
<div class="header">
  <img class="logo" src="/glmw-logo.png" alt="GLMW Scouts">
  <div class="hdiv"></div>
  <div class="htitle">GLMW Scout Calendar
    <small>Greater London Middlesex West · 2026–27</small>
  </div>
  <div class="hright">
    <div class="vtabs">
      <button class="vtab active" data-view="month" onclick="setView('month')">Month</button>
      <button class="vtab" data-view="list" onclick="setView('list')">List</button>
      <button class="vtab" data-view="subscribe" onclick="setView('subscribe')">Subscribe</button>
    </div>
    <button class="btn btn-p btn-sm" id="addBtn" onclick="openAdd()" style="display:none">＋ Add Event</button>
    <div id="authArea"><button class="login-btn" onclick="goLogin()">🔑 Login to edit</button></div>
  </div>
</div>

<div class="app-body">
  <aside class="sidebar">
    <div>
      <div class="sh">Event Types</div>
      <label class="leg"><input type="checkbox" checked onchange="setFilter('national',this.checked)"><span class="ldot" style="background:var(--nat-b)"></span>National</label>
      <label class="leg"><input type="checkbox" checked onchange="setFilter('county',this.checked)"><span class="ldot" style="background:var(--cty-b)"></span>County (GLMW)</label>
      <label class="leg"><input type="checkbox" checked onchange="setFilter('region',this.checked)"><span class="ldot" style="background:var(--rgn-b)"></span>London Region</label>
      <label class="leg"><input type="checkbox" checked onchange="setFilter('training',this.checked)"><span class="ldot" style="background:var(--trn-b)"></span>Training</label>
      <label class="leg"><input type="checkbox" checked onchange="setFilter('international',this.checked)"><span class="ldot" style="background:var(--int-b)"></span>International</label>
      <label class="leg"><input type="checkbox" checked onchange="setFilter('district',this.checked)"><span class="ldot" style="background:var(--dst-b)"></span>District</label>
    </div>
    <div>
      <div class="sh">Districts</div>
      <div id="distList"></div>
      <div class="dadd">
        <input id="newDist" type="text" placeholder="Add district…" maxlength="40" onkeydown="if(event.key==='Enter')addDistrict()">
        <button onclick="addDistrict()">＋</button>
      </div>
    </div>
    <div>
      <div class="sh">Filter by District</div>
      <div class="dfilter" id="dfilter">
        <button class="dfpill active" data-id="all" onclick="setDF('all',this)">All Districts</button>
      </div>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="loading"><div class="spinner"></div>Loading…</div>
  </main>
  <img class="watermark" src="/glmw-logo.png" alt="">
</div>

<div class="overlay" id="overlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="mbox">
    <button class="mclose" onclick="closeModal()">✕</button>
    <h2 id="mtitle">New Event</h2>
    <div class="fg"><label>Event Name</label><input id="eName" type="text" maxlength="100" placeholder="e.g. County Camp"></div>
    <div class="fg"><label>Date</label><input id="eDate" type="date"></div>
    <div class="fg"><label>End Date (multi-day, optional)</label><input id="eEnd" type="date"></div>
    <div class="fg">
      <label>Type</label>
      <select id="eType" onchange="toggleDG()">
        <option value="national">National</option>
        <option value="county" selected>County (GLMW)</option>
        <option value="region">London Region</option>
        <option value="training">Training / Learning</option>
        <option value="international">International</option>
        <option value="district">District</option>
      </select>
    </div>
    <div class="fg" id="eDG" style="display:none"><label>District</label><select id="eDist"></select></div>
    <div class="fg"><label>Location</label><input id="eLoc" type="text" maxlength="100" placeholder="e.g. PACCAR, Denham"></div>
    <div class="fg"><label>Notes</label><textarea id="eNotes" placeholder="Any details…"></textarea></div>
    <div class="mact">
      <button class="btn btn-d btn-sm" id="delBtn" style="display:none;margin-right:auto" onclick="deleteEv()">🗑 Delete</button>
      <button class="btn btn-g btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-p btn-sm" onclick="saveEv()">Save Event</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const TL={national:'National',county:'County (GLMW)',training:'Training',region:'London Region',international:'International',district:'District'};
const DP=[
  {bg:'#fee2e2',b:'#dc2626',t:'#7f1d1d'},
  {bg:'#fce7f3',b:'#db2777',t:'#831843'},
  {bg:'#fff7ed',b:'#ea580c',t:'#7c2d12'},
  {bg:'#fefce8',b:'#ca8a04',t:'#713f12'},
  {bg:'#f0fdf4',b:'#16a34a',t:'#14532d'},
  {bg:'#ecfeff',b:'#0891b2',t:'#164e63'},
  {bg:'#eff6ff',b:'#2563eb',t:'#1e3a8a'},
  {bg:'#f5f3ff',b:'#7c3aed',t:'#3b0764'},
];
const dc=i=>DP[i%DP.length];

let evs=[],dists=[],me=null;
let flt={national:true,county:true,training:true,region:true,international:true,district:true};
let view='month',cy=2026,cm=9,eid=null,dfId='all';

async function req(path,o={}){
  const r=await fetch('/api/'+path,{...o,headers:{'Content-Type':'application/json',...o.headers},credentials:'include'});
  if(!r.ok){const e=await r.json().catch(()=>({error:r.statusText}));throw new Error(e.error||r.statusText);}
  return r.json();
}

async function boot(){
  try{
    const m=await req('auth/me');
    if(m.authenticated){
      me=m;document.body.classList.add('editor');
      document.getElementById('addBtn').style.display='inline-flex';
      document.getElementById('authArea').innerHTML=`<div class="auth-pill">${m.picture?`<img class="auth-av" src="${m.picture}" alt="">`:''}${m.name}<button class="btn btn-g btn-sm" onclick="logout()" style="padding:3px 8px;margin-left:2px">Sign out</button></div>`;
    }
  }catch(e){}
  const[e,d]=await Promise.all([req('events'),req('districts')]);
  evs=e;dists=d;
  renderDList();renderDFilter();renderDModal();render();
}

function goLogin(){window.location.href='/api/auth/google';}
async function logout(){await fetch('/api/auth/logout',{method:'POST',credentials:'include'});window.location.reload();}

function renderDList(){
  document.getElementById('distList').innerHTML=dists.length
    ?dists.map((d,i)=>{const c=dc(i);return`<div class="dpill" style="background:${c.bg};color:${c.t};border-color:${c.b}"><span>${d.name}</span><button class="dpill-del" onclick="delDist('${d.id}')">✕</button></div>`;}).join('')
    :'<div style="font-size:.73rem;color:var(--muted)">No districts yet</div>';
}
function renderDFilter(){
  const cur=dfId;
  document.getElementById('dfilter').innerHTML=
    `<button class="dfpill${cur==='all'?' active':''}" data-id="all" onclick="setDF('all',this)" style="${cur==='all'?'background:var(--purple-light);color:var(--purple);border-color:var(--purple);border-width:2px':''}">All Districts</button>`+
    dists.map((d,i)=>{const c=dc(i),a=cur===d.id;
      return`<button class="dfpill${a?' active':''}" data-id="${d.id}" onclick="setDF('${d.id}',this)"
        style="${a?`background:${c.bg};color:${c.t};border-color:${c.b};border-width:2px`:''}">
        <span class="dfpill-dot" style="background:${c.b}"></span>${d.name}</button>`;
    }).join('');
}
function renderDModal(){
  const s=document.getElementById('eDist');if(!s)return;
  s.innerHTML=dists.length?dists.map(d=>`<option value="${d.id}">${d.name}</option>`).join(''):'<option value="">No districts yet</option>';
}
function setDF(id,el){
  dfId=id;
  document.querySelectorAll('.dfpill').forEach(p=>{p.classList.remove('active');p.style.cssText='';});
  if(el){
    el.classList.add('active');
    if(id==='all'){el.style.cssText='background:var(--purple-light);color:var(--purple);border-color:var(--purple);border-width:2px';}
    else{const i=dists.findIndex(d=>d.id===id);if(i>=0){const c=dc(i);el.style.cssText=`background:${c.bg};color:${c.t};border-color:${c.b};border-width:2px`;}}
  }
  render();
}
async function addDistrict(){
  const inp=document.getElementById('newDist'),name=inp.value.trim();if(!name)return;
  try{const d=await req('districts',{method:'POST',body:JSON.stringify({name})});dists.push(d);inp.value='';renderDList();renderDFilter();renderDModal();toast('District added ✓');}
  catch(e){toast('Error: '+e.message);}
}
async function delDist(id){
  if(!confirm('Remove this district?'))return;
  try{await req('districts/'+id,{method:'DELETE'});dists=dists.filter(d=>d.id!==id);if(dfId===id)dfId='all';renderDList();renderDFilter();renderDModal();render();toast('District removed');}
  catch(e){toast('Error: '+e.message);}
}

function setFilter(t,v){flt[t]=v;render();}
function fil(){
  return evs.filter(e=>{
    if(!flt[e.type])return false;
    if(dfId!=='all'&&e.type==='district'&&e.district!==dfId)return false;
    return true;
  });
}

function setView(v){view=v;document.querySelectorAll('.vtab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));render();}
function render(){if(view==='month')rMonth();else if(view==='list')rList();else rSub();}

function rMonth(){
  const m=document.getElementById('main');
  const first=new Date(cy,cm,1);let sd=first.getDay();sd=sd===0?6:sd-1;
  const dim=new Date(cy,cm+1,0).getDate(),dip=new Date(cy,cm,0).getDate();
  const today=new Date(),ev=fil();
  let h=`<div class="chead"><button class="today-btn" onclick="goToday()">Today</button>
    <button class="btn-ico" onclick="prev()">‹</button><button class="btn-ico" onclick="nxt()">›</button>
    <h2>${MONTHS[cm]} ${cy}</h2>
    <select class="mjump" onchange="jmp(this.value)">${mopts()}</select></div>
  <div class="cgrid">${DAYS.map(d=>`<div class="cdh">${d}</div>`).join('')}`;
  let dc2=1,nc=1;const tot=Math.ceil((sd+dim)/7)*7;
  for(let i=0;i<tot;i++){
    let cd,ot=false;
    if(i<sd){cd=new Date(cy,cm-1,dip-sd+i+1);ot=true;}
    else if(dc2>dim){cd=new Date(cy,cm+1,nc++);ot=true;}
    else cd=new Date(cy,cm,dc2++);
    const ds=fmt(cd),isT=cd.toDateString()===today.toDateString();
    const de=ev.filter(e=>e.endDate&&e.endDate>e.date?ds>=e.date&&ds<=e.endDate:e.date===ds);
    const chips=de.slice(0,3).map(e=>{
      const di=e.type==='district'?dists.findIndex(d=>d.id===e.district):-1;
      const dn=di>=0?(dists[di]?.name||''):'';
      const c2=di>=0?dc(di):null;
      const sty=c2?`style="background:${c2.bg};color:${c2.t};border-color:${c2.b}"`:'';
      return`<div class="chip ${e.type}" ${sty} onclick="viewEv('${e.id}')" title="${e.name}">${dn?dn+': ':''}${e.name}</div>`;
    }).join('');
    const more=de.length>3?`<div class="more">+${de.length-3} more</div>`:'';
    const isEd=document.body.classList.contains('editor');
    h+=`<div class="ccell${ot?' other':''}${isT?' today':''}"><div class="drow">
      <span class="dnum">${cd.getDate()}</span>
      ${isEd?`<button class="addbt" onclick="openAdd('${ds}')">＋</button>`:''}
    </div>${chips}${more}</div>`;
  }
  m.innerHTML=h+'</div>';
}

function rList(){
  const m=document.getElementById('main');
  const ev=fil().slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(!ev.length){m.innerHTML='<div class="loading">No events match your filters.</div>';return;}
  const g={};
  for(const e of ev){const d=new Date(e.date);const k=d.getFullYear()+'-'+String(d.getMonth()).padStart(2,'0');if(!g[k])g[k]={l:MONTHS[d.getMonth()]+' '+d.getFullYear(),i:[]};g[k].i.push(e);}
  let h='';
  for(const k of Object.keys(g).sort()){
    const x=g[k];
    h+=`<div class="lmonth"><div class="lmh">${x.l}<span class="lcnt">${x.i.length}</span></div>`;
    for(const e of x.i){
      const d=new Date(e.date+'T00:00');
      const dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
      const di=e.type==='district'?dists.findIndex(x=>x.id===e.district):-1;
      const dn=di>=0?(dists[di]?.name||''):'';
      const c2=di>=0?dc(di):null;
      const bl=e.type==='district'?(dn||'District'):(TL[e.type]||e.type);
      const bsty=c2?`style="background:${c2.bg};color:${c2.t};border:1.5px solid ${c2.b}"`:'';
      const brsty=c2?`style="background:${c2.b}"`:'';
      const es=e.endDate&&e.endDate!==e.date?` – ${disp(e.endDate)}`:'';
      h+=`<div class="lev" onclick="viewEv('${e.id}')">
        <div class="lbar ${e.type}" ${brsty}></div>
        <div class="ldate"><div class="lday">${d.getDate()}</div><div class="ldow">${dow}</div></div>
        <div class="linfo"><div class="ltitle">${e.name}</div>
        <div class="lmeta">${disp(e.date)}${es}${e.location?' · '+e.location:''}${e.notes?'<br><em>'+e.notes+'</em>':''}</div></div>
        <span class="lbadge ${e.type}" ${bsty}>${bl}</span></div>`;
    }
    h+='</div>';
  }
  m.innerHTML=h;
}

function rSub(){
  const base=window.location.origin;
  const ics=`${base}/api/calendar.ics`;
  const webcal=ics.replace(/^https?/,'webcal');
  const n=fil().length;
  document.getElementById('main').innerHTML=`
  <div style="max-width:640px">
    <h2 style="font-size:1.05rem;font-weight:500;margin-bottom:4px">Subscribe &amp; Export</h2>
    <p style="font-size:.8rem;color:var(--muted);margin-bottom:18px">Subscribe so your calendar app <strong>auto-updates</strong> whenever events are added. Works with Google Calendar, Apple Calendar, Outlook and any app supporting iCal / webcal.</p>
    <div class="panel">
      <h3>⚡ One-click Subscribe</h3>
      <div class="sgrid">
        <a class="scard" href="https://www.google.com/calendar/render?cid=${encodeURIComponent(webcal)}" target="_blank">
          <img src="/google-cal-logo.png" alt="Google Calendar">
          <div><div style="font-weight:600">Google Calendar</div><div style="font-size:.68rem;color:var(--muted)">Auto-updates</div></div>
        </a>
        <a class="scard" href="https://outlook.live.com/calendar/0/addcalendar?url=${encodeURIComponent(ics)}" target="_blank">
          <img src="/outlook-logo.png" alt="Outlook">
          <div><div style="font-weight:600">Outlook</div><div style="font-size:.68rem;color:var(--muted)">Auto-updates</div></div>
        </a>
        <a class="scard" href="${webcal}">
          <img src="/apple-cal-logo.png" alt="Apple Calendar">
          <div><div style="font-weight:600">Apple Calendar</div><div style="font-size:.68rem;color:var(--muted)">Opens directly</div></div>
        </a>
        <a class="scard" href="${ics}" download="GLMW-Calendar.ics">
          <span class="scard-ico">⬇️</span>
          <div><div style="font-weight:600">Download .ics</div><div style="font-size:.68rem;color:var(--muted)">${n} events</div></div>
        </a>
      </div>
      <div class="surl"><span id="surlTxt">${ics}</span><button onclick="cpUrl()">Copy</button></div>
      <p style="font-size:.72rem;color:var(--muted);margin-top:8px">💡 Subscribed calendars refresh automatically — new events appear within 6–24 hours.</p>
    </div>
    <div class="panel">
      <h3>📋 Import steps – Google Calendar</h3>
      <ol style="font-size:.8rem;line-height:2.1;padding-left:18px">
        <li>Click <strong>⬇️ Download .ics</strong> above</li>
        <li>Open <a href="https://calendar.google.com" target="_blank" style="color:var(--purple)">calendar.google.com</a> on desktop</li>
        <li>Click ⚙️ Settings → <em>Import &amp; export</em> → <strong>Import</strong></li>
      </ol>
    </div>
  </div>`;
}
function cpUrl(){navigator.clipboard.writeText(document.getElementById('surlTxt').textContent).then(()=>toast('URL copied! ✓'));}

function openAdd(ds){
  if(!me){goLogin();return;}
  eid=null;
  document.getElementById('mtitle').textContent='New Event';
  ['eName','eLoc','eNotes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('eDate').value=ds||'';
  document.getElementById('eEnd').value='';
  document.getElementById('eType').value='county';
  document.getElementById('delBtn').style.display='none';
  renderDModal();toggleDG();
  document.getElementById('overlay').style.display='flex';
  setTimeout(()=>document.getElementById('eName').focus(),80);
}
function viewEv(id){
  const e=evs.find(x=>x.id===id);if(!e)return;
  if(!me){showRO(e);return;}
  eid=id;
  document.getElementById('mtitle').textContent='Edit Event';
  document.getElementById('eName').value=e.name;
  document.getElementById('eDate').value=e.date;
  document.getElementById('eEnd').value=e.endDate||'';
  document.getElementById('eType').value=e.type;
  document.getElementById('eLoc').value=e.location||'';
  document.getElementById('eNotes').value=e.notes||'';
  document.getElementById('delBtn').style.display='inline-flex';
  renderDModal();if(e.district)document.getElementById('eDist').value=e.district;
  toggleDG();
  document.getElementById('overlay').style.display='flex';
}
function showRO(e){
  const di=e.type==='district'?dists.findIndex(d=>d.id===e.district):-1;
  const dn=di>=0?(dists[di]?.name||''):'';
  const bl=e.type==='district'?(dn||'District'):(TL[e.type]||e.type);
  const es=e.endDate&&e.endDate!==e.date?` – ${disp(e.endDate)}`:'';
  document.getElementById('mbox').innerHTML=`
    <button class="mclose" onclick="closeModal()">✕</button>
    <h2>${e.name}</h2>
    <div style="font-size:.86rem;line-height:2;margin-bottom:14px">
      📅 ${disp(e.date)}${es}<br>
      ${e.location?'📍 '+e.location+'<br>':''}
      🏷 <span style="background:var(--purple-light);color:var(--purple);border-radius:10px;padding:1px 9px;font-size:.72rem">${bl}</span>
      ${e.notes?'<br>📝 <em style="color:var(--muted)">'+e.notes+'</em>':''}
    </div>
    <div style="background:var(--bg);border-radius:8px;padding:10px;font-size:.76rem;color:var(--muted);text-align:center;margin-bottom:12px">
      🔒 <a href="#" onclick="event.preventDefault();closeModal();goLogin()" style="color:var(--purple)">Sign in with @glmwscouts.org.uk to edit</a>
    </div>
    <button class="btn btn-g btn-sm" onclick="closeModal()" style="float:right">Close</button>`;
  document.getElementById('overlay').style.display='flex';
}
const MODAL_ORIG=document.getElementById('mbox').innerHTML;
function closeModal(){document.getElementById('overlay').style.display='none';eid=null;if(!document.getElementById('eName'))document.getElementById('mbox').innerHTML=MODAL_ORIG;}
function toggleDG(){document.getElementById('eDG').style.display=document.getElementById('eType').value==='district'?'block':'none';}
async function saveEv(){
  const name=document.getElementById('eName').value.trim(),date=document.getElementById('eDate').value;
  if(!name){toast('Please enter a name');return;}if(!date){toast('Please select a date');return;}
  const type=document.getElementById('eType').value;
  const body={name,date,endDate:document.getElementById('eEnd').value||'',type,
    district:type==='district'?document.getElementById('eDist').value:'',
    location:document.getElementById('eLoc').value.trim(),notes:document.getElementById('eNotes').value.trim()};
  try{
    if(eid){const ev=await req('events/'+eid,{method:'PUT',body:JSON.stringify(body)});evs=evs.map(e=>e.id===eid?{...ev,id:eid}:e);toast('Event updated ✓');}
    else{const ev=await req('events',{method:'POST',body:JSON.stringify(body)});evs.push(ev);toast('Event added ✓');}
    closeModal();render();
  }catch(e){toast('Error: '+e.message);}
}
async function deleteEv(){
  if(!eid||!confirm('Delete this event?'))return;
  try{await req('events/'+eid,{method:'DELETE'});evs=evs.filter(e=>e.id!==eid);closeModal();render();toast('Event deleted');}
  catch(e){toast('Error: '+e.message);}
}

function goToday(){const t=new Date();cy=t.getFullYear();cm=t.getMonth();render();}
function prev(){cm--;if(cm<0){cm=11;cy--;}if(cy<2026||(cy===2026&&cm<8)){cy=2026;cm=8;}render();}
function nxt(){cm++;if(cm>11){cm=0;cy++;}if(cy>2027||(cy===2027&&cm>7)){cy=2027;cm=7;}render();}
function jmp(v){const[y,m]=v.split('-').map(Number);cy=y;cm=m;render();}
function mopts(){let o='',d=new Date(2026,8,1);while(d<=new Date(2027,7,1)){const y=d.getFullYear(),m=d.getMonth();o+=`<option value="${y}-${m}"${y===cy&&m===cm?' selected':''}>${MONTHS[m]} ${y}</option>`;d.setMonth(d.getMonth()+1);}return o;}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function disp(s){if(!s)return'';const[y,m,day]=s.split('-');return`${parseInt(day)} ${MONTHS[parseInt(m)-1]} ${y}`;}
let tT;function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>el.classList.remove('show'),3000);}

boot();
</script>
</body>
</html>
